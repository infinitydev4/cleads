# AI worker of the CRM on the VPS (docs/crm-v1/WORKER-IA.md), installed as /opt/cleads/ai/docker-compose.yml.
# Its own Compose project: the Extractor's deployments (`up --remove-orphans` in /opt/cleads) never touch it. It joins
# the Extractor's network to reach its MCP endpoint, and needs no published port.
name: cleads-ai

services:
  ai-worker:
    image: cleads-ai-worker:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    # Secrets (database, AI Gateway, Pusher, Extractor key): chmod 600, filled by scripts/set-ai-worker-env.sh.
    env_file: [worker.env]
    environment:
      NODE_ENV: production
      EXTRACTOR_MCP_URL: http://api:8080/mcp
      # E28: missions launch, follow and import searches through the Extractor's API, on the local network.
      EXTRACTOR_URL: http://api:8080
      WORKER_ID: ai-worker-1
      # The CRM's public address, for the links the worker writes (booking page in a drafted answer, E22).
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://cleads.fr}
      # E23: where the Studio's previews are served; PageSpeed measures each new version there.
      STUDIO_PREVIEW_HOST: ${PREVIEW_HOST:-apercu.cleads.fr}
      # The root filesystem is read-only: Chromium keeps its configuration and cache in /tmp.
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
    read_only: true
    # Chromium (E23) writes its profile and shared memory under /tmp.
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Node and, during a Studio run, one headless Chromium (about 300 MB for a page render).
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    stop_grace_period: 40s # the worker gives runs 25 s to finish, then puts them back in the queue
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.mjs"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 3
    networks: [extractor]

networks:
  extractor:
    external: true
    name: cleads_default
